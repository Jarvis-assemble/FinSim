<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="finShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#059669" />
      <stop offset="60%" stopColor="#047857" />
      <stop offset="100%" stopColor="#064e3b" />
    </linearGradient>
    <linearGradient id="finGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000" floodOpacity="0.25"/>
    </filter>
  </defs>

  <!-- Finance Green Base Shield -->
  <rect width="64" height="64" rx="16" fill="url(#finShieldGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#34d399" stroke-width="1.5" opacity="0.4" fill="none" />

  <!-- Ascending Financial Growth Bars -->
  <rect x="12" y="38" width="7" height="13" rx="2" fill="#ffffff" opacity="0.85" filter="url(#finGlow)" />
  <rect x="22" y="30" width="7" height="21" rx="2" fill="#ffffff" opacity="0.95" filter="url(#finGlow)" />
  <rect x="32" y="23" width="7" height="28" rx="2" fill="url(#finGoldGrad)" filter="url(#finGlow)" />

  <!-- Upward Financial Growth Trend Line -->
  <path
    d="M14 34L25 24L34 27L48 13"
    stroke="#34d399"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#finGlow)"
  />
  <path
    d="M40 13H48V21"
    stroke="#34d399"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#finGlow)"
  />

  <!-- Golden Rupee Currency Emblem -->
  <circle cx="45" cy="38" r="9.5" fill="url(#finGoldGrad)" filter="url(#finGlow)" />
  <text
    x="45"
    y="44"
    text-anchor="middle"
    font-size="13"
    font-weight="900"
    fill="#064e3b"
    font-family="system-ui, -apple-system, sans-serif"
  >
    ₹
  </text>
</svg>